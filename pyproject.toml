[project]
name = "smartcrop-ai"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = [
    "Flask>=3.0,<4.0",
    "pandas>=2.1,<3.0",
    "numpy>=1.26,<3.0",
    "scikit-learn>=1.4,<2.0",
    "joblib>=1.3,<2.0",
    "python-dotenv>=1.0,<2.0",
    "mysql-connector-python>=8.3,<10.0",
]

[tool.vercel]
entrypoint = "backend.app:app"
